name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build browser bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan all tracked files for secrets
        run: node scripts/secrets-scan.mjs --all-tracked --block
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test
      - name: Build Chrome and Firefox bundles
        run: pnpm build
      - name: Validate extension bundles
        shell: pwsh
        run: |
          ./scripts/validate-extension.ps1 -Target chrome
          ./scripts/validate-extension.ps1 -Target firefox
      - name: Package store artifacts
        shell: pwsh
        run: |
          ./scripts/package-webstore.ps1 -Target chrome -Version "$env:GITHUB_REF_NAME"
          ./scripts/package-webstore.ps1 -Target firefox -Version "$env:GITHUB_REF_NAME"
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: many-ai-usage-release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: many-ai-usage-release-assets
          path: release-assets
      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mapfile -d "" assets < <(find release-assets -maxdepth 1 -type f -print0)
          [ "${#assets[@]}" -gt 0 ] || { echo "no release assets" >&2; exit 1; }
          checksum_section=$'\n\n---\n\n## SHA-256 Checksums\n\n```\n'"$(cat release-assets/SHA256SUMS.txt)"$'\n```'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          fi
          body="$(gh release view "$tag" --json body --jq '.body')"
          case "$body" in
            *"## SHA-256 Checksums"*) : ;;
            *) gh release edit "$tag" --notes "${body}${checksum_section}" ;;
          esac
